```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nova — Login & Signup</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top left, #5b21b6, transparent 35%),
        radial-gradient(circle at bottom right, #0ea5e9, transparent 35%),
        #080b16;
      color: white;
      padding: 20px;
    }

    .container {
      width: 420px;
      max-width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 55px;
      height: 55px;
      margin: 0 auto 18px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 25px;
      font-weight: bold;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aeb6c7;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .tab {
      width: 50%;
      padding: 11px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #aeb6c7;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .tab.active {
      color: white;
      background: rgba(255, 255, 255, 0.12);
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .input-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: #d5d9e3;
    }

    .input-box {
      position: relative;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      outline: none;
      background: rgba(0, 0, 0, 0.2);
      color: white;
      font-size: 14px;
      transition: 0.25s;
    }

    input::placeholder {
      color: #70798d;
    }

    input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
    }

    .password-input {
      padding-right: 50px;
    }

    .show-password {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #9da6b8;
      cursor: pointer;
      font-size: 12px;
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0 20px;
      font-size: 12px;
      color: #aeb6c7;
    }

    .remember {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .remember input {
      width: auto;
      accent-color: #8b5cf6;
    }

    .forgot {
      color: #a78bfa;
      text-decoration: none;
    }

    .submit-btn {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 12px;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      transition: 0.25s;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.25);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(99, 102, 241, 0.35);
    }

    .terms {
      margin-top: 18px;
      text-align: center;
      color: #7f889b;
      font-size: 11px;
      line-height: 1.6;
    }

    .terms a {
      color: #a78bfa;
      text-decoration: none;
    }

    .message {
      display: none;
      text-align: center;
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(34, 197, 94, 0.12);
      color: #86efac;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 25px 20px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">N</div>

    <h1>Welcome to Nova</h1>

    <p class="subtitle">
      Sign in to your account or create a new one
    </p>

    <!-- Login / Signup Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="showForm('login', this)">
        Login
      </button>

      <button class="tab" onclick="showForm('signup', this)">
        Sign Up
      </button>
    </div>


    <!-- LOGIN FORM -->
    <form id="login" class="form active" onsubmit="handleSubmit(event, 'login')">

      <div class="input-group">
        <label>Email Address</label>

        <input
          type="email"
          placeholder="you@example.com"
          required
        >
      </div>


      <div class="input-group">
        <label>Password</label>

        <div class="input-box">

          <input
            id="loginPassword"
            class="password-input"
            type="password"
            placeholder="Enter your password"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('loginPassword', this)"
          >
            Show
          </button>

        </div>
      </div>


      <div class="options">

        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#" class="forgot">
          Forgot password?
        </a>

      </div>


      <button class="submit-btn" type="submit">
        Sign In
      </button>

    </form>


    <!-- SIGNUP FORM -->
    <form id="signup" class="form" onsubmit="handleSubmit(event, 'signup')">

      <div class="input-group">
        <label>Full Name</label>

        <input
          type="text"
          placeholder="Your full name"
          required
        >
      </div>


      <div class="input-group">
        <label>Email Address</label>

        <input
          type="email"
          placeholder="you@example.com"
          required
        >
      </div>


      <div class="input-group">
        <label>Password</label>

        <div class="input-box">

          <input
            id="signupPassword"
            class="password-input"
            type="password"
            placeholder="Create a password"
            minlength="6"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword('signupPassword', this)"
          >
            Show
          </button>

        </div>
      </div>


      <div class="input-group">
        <label>Confirm Password</label>

        <input
          id="confirmPassword"
          type="password"
          placeholder="Repeat your password"
          minlength="6"
          required
        >
      </div>


      <button class="submit-btn" type="submit">
        Create Account
      </button>

      <p class="terms">
        By creating an account, you agree to our
        <a href="#">Terms</a> and
        <a href="#">Privacy Policy</a>.
      </p>

    </form>


    <div id="message" class="message"></div>

  </div>


  <script>

    function showForm(formName, button) {

      document.querySelectorAll(".form").forEach(form => {
        form.classList.remove("active");
      });

      document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
      });

      document.getElementById(formName).classList.add("active");

      button.classList.add("active");

      document.getElementById("message").style.display = "none";
    }


    function togglePassword(inputId, button) {

      const input = document.getElementById(inputId);

      if (input.type === "password") {

        input.type = "text";
        button.textContent = "Hide";

      } else {

        input.type = "password";
        button.textContent = "Show";

      }
    }


    function handleSubmit(event, type) {

      event.preventDefault();

      if (type === "signup") {

        const password =
          document.getElementById("signupPassword").value;

        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            true
          );

          return;
        }
      }

      showMessage(
        type === "login"
          ? "Login form submitted successfully!"
          : "Account creation form submitted successfully!",
        false
      );
    }


    function showMessage(text, error) {

      const message = document.getElementById("message");

      message.textContent = text;
      message.style.display = "block";

      if (error) {
        message.style.background =
          "rgba(239, 68, 68, 0.12)";

        message.style.color = "#fca5a5";
      } else {
        message.style.background =
          "rgba(34, 197, 94, 0.12)";

        message.style.color = "#86efac";
      }
    }

  </script>

</body>
</html>
